[project]
name = "mllm"
version = "0.1.0"
description = "Zero-shot evaluation and latency benchmarks for multimodal models"
readme = "README.md"
authors = [
    { name = "lucduh", email = "lucienduhenry@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "pillow>=12.3.0",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "tqdm>=4.70.0",
    "transformers==5.15.0",
    "typer>=0.27.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
