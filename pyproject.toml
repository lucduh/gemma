[project]
name = "mllm"
version = "0.1.0"
description = "Zero-shot evaluation and latency benchmarks for multimodal models"
readme = "README.md"
authors = [
    { name = "lucduh", email = "lucienduhenry@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "peft>=0.20.0",
    "pillow>=12.3.0",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "tqdm>=4.70.0",
    "transformers==5.15.0",
    "typer>=0.27.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

